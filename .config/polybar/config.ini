;==========================================================
; Polybar — top bar for i3 (JetBrainsMono Nerd Font)
; Hardware: BAT1 / ACAD, wlan0 + enp3s0, k10temp (CPU)
;==========================================================

[colors]
background     = #dd1d2021
background-alt  = #282828
foreground     = #ebdbb2
primary        = #83a598
secondary      = #d3869b
alert          = #fb4934
disabled       = #665c54

[bar/main]
width  = 100%
height = 28pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 0pt

padding-left  = 1
padding-right = 1
module-margin = 1

separator = %{F#665c54}|%{F-}

font-0 = JetBrainsMono Nerd Font:size=11;3
font-1 = JetBrainsMono Nerd Font:size=14;4

modules-left   = i3 xwindow
modules-center = date
modules-right  = pulseaudio memory cpu temperature wlan eth battery tray

cursor-click = pointer
enable-ipc   = true

; play nicely with i3 stacking
wm-restack = i3

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline  = ${colors.primary}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-padding = 2

label-visible = %name%
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:70:…%
label-empty =
label-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %{F#83a598}%{F-} %date%  %{F#83a598}%{F-} %time%

[module/cpu]
type = internal/cpu
interval = 2
label = %{F#83a598}%{F-} %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
label = %{F#83a598}%{F-} %gb_used%

[module/temperature]
type = internal/temperature
interval = 2
hwmon-path = ${env:TEMP_HWMON:}
base-temperature = 20
warn-temperature = 85
label = %{F#83a598}%{F-} %temperature-c%
label-warn = %{F#fb4934}%{F-} %temperature-c%
label-warn-foreground = ${colors.alert}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted =  muted
label-muted-foreground = ${colors.disabled}
ramp-volume-0 =
ramp-volume-1 =
ramp-volume-2 =
click-right = pavucontrol

[module/wlan]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 3
format-connected =  %essid%
format-connected-foreground = ${colors.foreground}
format-disconnected =  off
format-disconnected-foreground = ${colors.disabled}

[module/eth]
type = internal/network
interface = enp3s0
interface-type = wired
interval = 3
format-connected =  %ifname%
format-disconnected =

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT1
adapter = ACAD
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
label-full =  100%

ramp-capacity-0 =
ramp-capacity-1 =
ramp-capacity-2 =
ramp-capacity-3 =
ramp-capacity-4 =
ramp-capacity-0-foreground = ${colors.alert}

animation-charging-0 =
animation-charging-1 =
animation-charging-2 =
animation-charging-3 =
animation-charging-4 =
animation-charging-framerate = 750

[module/tray]
type = internal/tray
tray-size = 16px
tray-spacing = 8px
tray-background = ${colors.background}

[settings]
screen-change-reload = true
pseudo-transparency = true
