#################################
# picom config — transparency, shadows, fade, rounded corners
# Tuned for i3 on a laptop (eDP-1). picom 13+ syntax.
# Docs: https://man.archlinux.org/man/picom.1
#################################

# ---- Backend ----
backend = "glx";          # GPU-accelerated; fall back to "xrender" if you see glitches
vsync = true;             # eliminate screen tearing

# ---- Shadows ----
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
# Don't draw shadows on these:
shadow-exclude = [
  "class_g = 'i3-frame'",
  "class_g ?= 'Polybar'",
  "class_g ?= 'i3bar'",
  "_GTK_FRAME_EXTENTS@:c",     # avoids double-shadow on CSD GTK windows
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ---- Fading ----
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

# ---- Transparency / Opacity ----
inactive-opacity = 0.92;       # dim unfocused windows slightly
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Keep these fully opaque regardless of focus:
focus-exclude = [
  "class_g = 'Alacritty' && argb",   # let Alacritty's own opacity setting win
];

# Per-window opacity rules (terminals get a touch of see-through):
opacity-rule = [
  "92:class_g = 'Alacritty' && focused",
  "85:class_g = 'Alacritty' && !focused"
];

# ---- Rounded corners ----
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'i3bar'",
  "class_g ?= 'Polybar'"
];

# ---- Blur behind transparent windows (subtle) ----
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ---- General behavior ----
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

wintypes:
{
  tooltip      = { fade = true; shadow = true; opacity = 0.95; focus = true; };
  dock         = { shadow = false; };
  dnd          = { shadow = false; };
  popup_menu   = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
