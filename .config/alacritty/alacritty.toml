# Alacritty config — themed to match the EndeavourOS i3 dark setup.
# Docs: https://alacritty.org/config-alacritty.html

[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
decorations = "none"
opacity = 1.0

[font]
size = 11.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[scrolling]
history = 10000

[cursor]
style = { shape = "Block", blinking = "On" }

# Colors: none specified, so Alacritty uses its built-in default
# dark (black) theme. Delete nothing here to keep it — add a
# [colors.primary] block only if you want to customize later.

# Preserve the binding that was already in your config
# (sends ESC + CR on Shift+Enter, useful in some shells/apps).
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
