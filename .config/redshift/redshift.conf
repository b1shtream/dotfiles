; Redshift — color temperature by time of day (Bangalore)
[redshift]
temp-day=5500
temp-night=3800
; slight dimming at night (1.0 = no change)
brightness-day=1.0
brightness-night=0.92
; smooth fade between day/night
transition=1
; use the X RandR method (X11)
adjustment-method=randr
; fixed location (avoids needing geoclue)
location-provider=manual

[manual]
lat=12.97
lon=77.59
